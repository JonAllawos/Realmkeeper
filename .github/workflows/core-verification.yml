name: Core verification (.NET, no Unity)

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and run EditMode test sources
        run: Tools/DotNet/verify.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: Tools/DotNet/TestResults/
